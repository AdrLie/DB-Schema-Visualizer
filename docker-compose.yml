services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: schemaflow
      POSTGRES_PASSWORD: password
      POSTGRES_DB: schemaflow
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - "4001:4001"
    environment:
      - DATABASE_URL=postgresql://schemaflow:password@postgres:5432/schemaflow?schema=public
      - JWT_SECRET=super-secret-jwt-key
      - PORT=4001
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "4002:4002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:4001
    depends_on:
      - api

volumes:
  postgres-data:
